name: Integration

# Exercises the package as PUBLISHED on PyPI, against staging. CI covers this working
# tree; nothing there would notice a tag that was never pushed, an sdist that ships no
# `src`, or a release that never landed.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # Off the hour on purpose: scheduled runs bunched at :00 are queued behind everyone
    # else's and can be dropped entirely under load.
    - cron: '37 6 * * *'

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # No pip cache: the point is the download a stranger gets. The script skips with a
      # reason when nothing is published yet, and the suite skips from inside itself when
      # the key is missing - a secret that does not exist interpolates to an empty string
      # here, which both treat as absent.
      - run: python3 scripts/run.py
        working-directory: integration
        env:
          INTERNETDATA_STAGING_KEY: ${{ secrets.INTERNETDATA_STAGING_KEY }}
